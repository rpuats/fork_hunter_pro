[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/engine",
    "crates/persistence",
    "crates/scanner",
    "crates/api",
    "crates/bot",
    "crates/parsers",
    "crates/fork_hunter_bin",
    "crates/corridor_scanner",
    "crates/express_forks",
    "crates/bankroll_manager",
    "crates/bonus_hunter",
    "crates/auto_betting",
    "crates/monitoring",
    ".",
]

# Root binary package removed to avoid conflict with fork_hunter_bin

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = { version = "0.14", features = ["yaml"] }
dotenvy = "0.15"
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli", "socks"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
moka = { version = "0.12", features = ["future"] }
teloxide = { version = "0.12", features = ["macros", "webhooks", "auto-send"] }
regex = "1.10"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5.5"
bloomfilter = "1.0"
lru = "0.12"
rand = "0.8"
url = "2.5"
time = "0.3"
strum = { version = "0.25", features = ["derive"] }
derive_more = "0.99"

[workspace.package]
edition = "2021"
version = "0.1.0"

## Removed per-workspace binary MVP; dependencies are defined per-crate

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
